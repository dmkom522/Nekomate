<!doctype html>
<html lang="zh-CN" class="bubble">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src &#x27;self&#x27;; script-src &#x27;self&#x27;; style-src &#x27;self&#x27;; style-src-attr &#x27;unsafe-inline&#x27;; img-src &#x27;self&#x27; data: blob:; media-src &#x27;self&#x27; blob:; connect-src &#x27;none&#x27;; object-src &#x27;none&#x27;; base-uri &#x27;none&#x27;; form-action &#x27;none&#x27;">
  <title>Nekomate</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/katex.min.css">
</head>
<body class="bubble">
  <aside class="rail">
    <div class="brand">Nekomate</div>
    <button class="nav active" id="chatNav" aria-current="page" data-i18n="一起听课吧！">一起听课吧！</button>
    <details class="history-group" open>
      <summary><span data-i18n="历史记录">历史记录</span><button id="historySearchToggle" type="button" aria-label="搜索历史对话" title="搜索历史对话" aria-expanded="false" aria-controls="historySearch" data-i18n-title="搜索历史对话" data-i18n-aria-label="搜索历史对话"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"></circle><path d="m16 16 5 5"></path></svg></button></summary>
      <input id="historySearch" type="search" placeholder="搜索对话" aria-label="搜索历史对话" hidden data-i18n-placeholder="搜索对话" data-i18n-aria-label="搜索历史对话">
      <nav id="historyList" aria-label="历史对话" data-i18n-aria-label="历史对话"><p class="history-empty" data-i18n="还没有历史对话">还没有历史对话</p></nav>
    </details>
    <button class="nav" id="settingsBtn"><span data-i18n="API 设置">API 设置 </span><b id="configDot"></b></button>
    <div class="rail-bottom"><span id="versionLabel">Nekomate</span></div>
  </aside>
  <main>
    <div class="bubble-header"><span>Nekomate</span><div><button id="closeBubbleBtn" aria-label="收起聊天气泡" data-i18n-aria-label="收起聊天气泡">×</button></div></div>
    <header class="topbar"><h1 id="pageTitle" data-i18n="一起听课吧！">一起听课吧！</h1><button class="button subtle" id="hidePanelBtn" title="收起后继续听课" data-i18n-title="收起后继续听课" data-i18n="收起">收起</button></header>
    <div class="workspace">
      <section class="watch-column" id="studyPage">

        <div class="section-heading"><h2><span class="live-dot" id="liveDot"></span><span data-i18n="学习画面">学习画面</span></h2><span class="badge" id="captureStatus" hidden></span></div>
        <div class="monitor">
          <video id="preview" autoplay muted playsinline></video>
          <div id="emptyPreview" class="empty-preview"><h3 data-i18n="选择正在看的课程">选择正在看的课程</h3><p><span data-i18n="选好窗口后收起这里，继续看课。">选好窗口后收起这里，继续看课。</span><br><span data-i18n="遇到不懂的地方，点桌宠问我。">遇到不懂的地方，点桌宠问我。</span></p><button class="button primary" id="chooseBtn" data-i18n="选择学习窗口">选择学习窗口</button></div>
          <div class="monitor-caption" id="monitorCaption" hidden><span id="sourceName"></span><span id="sessionClock">00:00</span></div>
        </div>
        <div class="capture-actions"><button class="button primary" id="captureBtn" data-i18n="选择窗口">选择窗口</button><button class="button" id="stopBtn" disabled data-i18n="暂停学习">暂停学习</button><button class="button subtle" id="newSessionBtn" data-i18n="开始新的学习">开始新的学习</button></div>
      </section>

      <section class="chat-panel" id="chatPage">
        <div class="messages" id="messages" aria-live="polite"></div>
        <div class="composer"><form id="questionForm"><textarea id="question" rows="3" maxlength="6000" placeholder="问问这一步，或说说你哪里没懂…" aria-label="你的问题" data-i18n-placeholder="问问这一步，或说说你哪里没懂…" data-i18n-aria-label="你的问题"></textarea><div class="composer-bottom"><div class="chat-model-picker"><select id="chatModel" aria-label="当前模型" data-i18n-aria-label="当前模型"><option value="" data-i18n="选择模型">选择模型</option></select><button id="chatFastMode" type="button" hidden aria-label="快速模式" aria-pressed="false" title="开启快速模式（仅答疑；可能增加费用或额度消耗）" data-i18n-title="开启快速模式（仅答疑；可能增加费用或额度消耗）" data-i18n-aria-label="快速模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 10-12h-7l0-8Z"></path></svg></button><button id="refreshChatModels" type="button" title="刷新模型列表" aria-label="刷新模型列表" data-i18n-title="刷新模型列表" data-i18n-aria-label="刷新模型列表">↻</button></div><span data-i18n="Ctrl / ⌘ + Enter 发送">Ctrl / ⌘ + Enter 发送</span><button class="button primary" id="sendBtn" type="submit" data-i18n="发送 ↗">发送 ↗</button><button class="button" id="cancelBtn" type="button" hidden data-i18n="取消">取消</button></div></form></div>
      </section>
    </div>
  <section id="settingsPage" class="settings-dialog" hidden>
    <form id="settingsForm">
      <label><span data-i18n="界面语言">界面语言</span><select id="languageSelect" aria-label="界面语言" data-i18n-aria-label="界面语言"><option value="zh-CN">中文（简体）</option><option value="en">English</option></select></label>
      <label><span data-i18n="选择服务">选择服务</span><select id="providerSelect" required><option value="" data-i18n="选择服务">选择服务</option></select></label>
      <div id="connectionDetails" hidden>
        <label id="connectionModeRow"><span data-i18n="连接方式">连接方式</span><select id="connectionMode"><option value="api">API</option><option value="cli" data-i18n="本机 CLI">本机 CLI</option></select></label>
        <fieldset id="apiFields">
          <legend data-i18n="连接 API">连接 API</legend>
          <label id="protocolRow" hidden><span data-i18n="接口格式">接口格式</span><select id="visionProtocol"><option value="openai" data-i18n="OpenAI 兼容">OpenAI 兼容</option><option value="anthropic">Claude Messages</option></select></label>
          <label><span data-i18n="API 基础地址">API 基础地址</span><input id="visionUrl" type="url" placeholder="服务商提供的基础地址" data-i18n-placeholder="服务商提供的基础地址"></label>
          <label>API Key<input id="visionKey" type="password" autocomplete="off" placeholder="填写你的密钥" data-i18n-placeholder="填写你的密钥"></label>
          <label class="check-row"><input id="clearVisionKey" type="checkbox"><span data-i18n="清除已保存的密钥"> 清除已保存的密钥</span></label>
          <label><span data-i18n="模型">模型</span><select id="visionModel"><option value="" data-i18n="选择模型">选择模型</option></select></label>
          <button id="refreshVisionModels" class="button subtle" type="button" data-i18n="刷新模型">刷新模型</button>
          <p id="visionModelStatus" class="footnote" role="status" hidden></p>
          <p id="providerHint" class="footnote"></p>
        </fieldset>
        <fieldset id="cliFields" hidden>
          <legend id="cliLegend" data-i18n="连接本机 CLI">连接本机 CLI</legend>
          <label id="cliKindRow" hidden><span data-i18n="使用的程序">使用的程序</span><select id="cliKind"><option value="codex">Codex CLI</option><option value="claude">Claude Code</option></select></label>
          <p id="cliHint" class="footnote"></p>
          <label><span id="cliPathLabel" data-i18n="本机路径">本机路径</span><input id="codexPath" placeholder="留空，从 PATH 自动检测" data-i18n-placeholder="留空，从 PATH 自动检测"></label>
          <div class="cli-actions"><button id="chooseCliBtn" class="button" type="button" data-i18n="选择文件">选择文件</button><button id="detectCliBtn" class="button" type="button" data-i18n="检测安装">检测安装</button></div>
          <p id="cliStatus" class="footnote" role="status"></p>
          <label><span data-i18n="模型">模型</span><select id="codexModel"><option value="" data-i18n="使用 CLI 默认模型">使用 CLI 默认模型</option></select></label>
          <button id="refreshCliModels" class="button subtle" type="button" data-i18n="刷新模型">刷新模型</button>
          <p id="cliModelStatus" class="footnote" role="status" hidden></p>
        </fieldset>
      </div>
      <div class="transcription-settings">
        <p class="footnote" data-i18n="语音默认在本机转写，无需额外配置。">语音默认在本机转写，无需额外配置。</p>
        <label id="selectedModelTranscriptionRow" class="check-row" hidden><input id="useSelectedModelTranscription" type="checkbox" disabled><span data-i18n="使用所选模型转写音频"> 使用所选模型转写音频</span></label>
        <p id="selectedModelTranscriptionHint" class="footnote" hidden data-i18n="勾选后，提问时会把最近两分钟录音发送给该模型。">勾选后，提问时会把最近两分钟录音发送给该模型。</p>
      </div>
      <p id="settingsError" class="error-text" role="alert"></p>
      <div class="dialog-footer"><span id="settingsStatus" role="status"></span><button type="submit" class="button primary" id="saveSettingsBtn" data-i18n="保存配置">保存配置</button></div>
    </form>
  </section>
  </main>

  <dialog id="pickerDialog" class="picker-dialog"><div class="dialog-heading"><div><h2 id="pickerTitle" tabindex="-1" data-i18n="选择课程窗口">选择课程窗口</h2></div><button class="icon-button" data-close="pickerDialog" aria-label="关闭窗口选择" data-i18n-aria-label="关闭窗口选择">×</button></div><div class="picker-toolbar"><button class="button" id="refreshSources" data-i18n="刷新列表">刷新列表</button></div><label class="check-row"><input type="checkbox" id="captureAudio" checked><span data-i18n="同时采集系统声音"> 同时采集系统声音 </span><span data-i18n="包含其他应用的声音">包含其他应用的声音</span></label><p id="audioHint" class="footnote"></p><label id="courseModeRow" hidden><span data-i18n="这次学习">这次学习</span><select id="courseMode"><option value="new" data-i18n="开始新的课程">开始新的课程</option><option value="continue" data-i18n="继续当前课程">继续当前课程</option></select></label><div class="source-grid" id="sourceGrid"></div><p id="pickerError" class="error-text" role="alert"></p></dialog>



  <dialog id="historyDialog" class="confirm-dialog"><form id="historyForm"><h2 data-i18n="管理对话">管理对话</h2><label><span data-i18n="名称">名称</span><input id="historyTitle" maxlength="80" required></label><p id="historyError" role="alert"></p><div class="dialog-footer"><button type="button" class="button subtle" id="deleteHistory" data-i18n="删除">删除</button><button type="button" class="button" data-close="historyDialog" data-i18n="取消">取消</button><button class="button primary" type="submit" data-i18n="保存">保存</button></div></form></dialog>
  <dialog id="deleteHistoryDialog" class="confirm-dialog"><h2 data-i18n="删除这段对话？">删除这段对话？</h2><p data-i18n="对话及学习笔记将从本机删除，无法恢复。">对话及学习笔记将从本机删除，无法恢复。</p><div class="dialog-footer"><button class="button" data-close="deleteHistoryDialog" data-i18n="取消">取消</button><button class="button primary" id="confirmDeleteHistory" data-i18n="删除对话">删除对话</button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
